[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sn83-clique-lab"
version = "0.1.0"
description = "Pure-Python ULM maximum-clique benchmark lab for Bittensor SN83"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.0",
  "numpy>=1.26",
  "pytest>=7.0",
]

[project.optional-dependencies]
dev = ["pytest"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
sn83-clique = "clique.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clique*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
